name: Release Production Binary

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run Unit Tests
        run: go test ./...

      - name: Compile Linux Binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o erm-dokter cmd/api/main.go
          sha256sum erm-dokter > erm-dokter.sha256

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Production Build"
          files: |
            erm-dokter
            erm-dokter.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
